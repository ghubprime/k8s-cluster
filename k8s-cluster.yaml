kind: Cluster
name: k8s-scots-lab
kubernetes:
  version: v1.36.1
talos:
  version: v1.13.3
features:
  diskEncryption: false
  enableWorkloadProxy: true
  useEmbeddedDiscoveryService: true
patches:
  - name: clusterconfig
    inline:
      cluster:
        allowSchedulingOnControlPlanes: true
        apiServer:
          admissionControl:
            - name: PodSecurity
              configuration:
                exemptions:
                  namespaces:
                    - rook-ceph
          extraArgs:
            feature-gates: UserNamespacesHostNetworkSupport=true
        controllerManager:
          extraArgs:
            feature-gates: UserNamespacesHostNetworkSupport=true
        scheduler:
          extraArgs:
            feature-gates: UserNamespacesHostNetworkSupport=true
        network:
          cni:
            name: none
        proxy:
          disabled: true
  - name: machinepatch
    inline:
      machine:
        network:
          nameservers:
            - 1.1.1.1
            - 8.8.8.8
        kubelet:
          extraConfig:
            featureGates:
              UserNamespacesHostNetworkSupport: true
            maxPods: 250
            shutdownGracePeriod: "600s"
            shutdownGracePeriodCriticalPods: "120s"
            imageGCHighThresholdPercent: 60
            imageGCLowThresholdPercent: 50
            # Unused images age out after 7d even when the GC high threshold is not
            # reached. Default is 0 = disabled, which lets superseded tags accumulate
            # indefinitely; 543 overlayfs snapshots were present on 2026-10-20 against
            # 46 live images. imageMinimumGCAge (2m default) still protects fresh pulls.
            imageMaximumGCAge: "168h"
            # Lower soft eviction thresholds from default 15% to 10% to prevent
            # pod evictions during transient upgrade churn on 29GB eMMC nodes.
            # Baseline image usage sits at ~83% (17% free), too close to the 15% default.
            evictionSoft:
              nodefs.available: "10%"
              imagefs.available: "10%"
            evictionSoftGracePeriod:
              nodefs.available: "1m30s"
              imagefs.available: "1m30s"
            # evictionHard MUST be set alongside evictionSoft, and MUST be lower.
            #
            # Until 2026-10-20 only evictionSoft was set here, so the defaults stayed in
            # force -- including `imagefs.available: 15%`. Hard eviction has NO grace
            # period and fires first, so at 15% free kubelet evicted immediately and the
            # soft 10%/90s path above was unreachable. The mitigation above had therefore
            # never once taken effect. Observed live on 2026-10-20: talos-pyf-pz9 hit
            # 14.0% free and instantly evicted two velero/node-agent pods (the fs-backup
            # workers), loki/alloy, rook-ceph-exporter and a running Job.
            #
            # imagefs and nodefs are the SAME partition on these nodes, so whichever
            # threshold is highest is the one that governs. Keeping hard below soft is
            # what makes the 90s grace period real.
            evictionHard:
              nodefs.available: "5%"
              imagefs.available: "5%"
              nodefs.inodesFree: "5%"
              imagefs.inodesFree: "5%"
              memory.available: "100Mi"

        features:
          hostDNS:
            enabled: true
            forwardKubeDNSToHost: false
        time:
          servers:
            - 0.us.pool.ntp.org
            - 1.us.pool.ntp.org
        sysctls:
          user.max_user_namespaces: "11255"

  - name: extramanifests-cilium
    file: bootstrap/k8s-cluster-extramanifests-cilium.yaml

  - name: extramanifests-multus
    file: bootstrap/k8s-cluster-extramanifests-multus.yaml

  - name: extramanifests-gateway-api-crds
    file: bootstrap/k8s-cluster-extramanifests-gateway-api-crds.yaml
  - name: extramanifests-argocd
    file: bootstrap/k8s-cluster-extramanifests-argocd.yaml

  - name: extramanifests-argocd-apps
    file: bootstrap/k8s-cluster-extramanifests-argocd-apps.yaml
---
kind: ControlPlane
machines:
  - 1e000000-4506-0595-0101-001e06459506
  - 1e000000-4506-b094-0101-001e064594b1
  - 1e000000-4506-fb95-0101-001e064595fc
patches:
  - name: controlplane-patch
    inline:
      machine:
        kernel:
          modules:
            - name: nbd
---
kind: Workers
machines: []
