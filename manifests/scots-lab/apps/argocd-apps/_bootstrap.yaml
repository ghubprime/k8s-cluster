apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/description: Network-wide DNS ad/tracker blocker
    argocd.argoproj.io/sync-wave: "2"
  name: adguard-home-scots-lab
  namespace: argocd
spec:
  destination:
    namespace: adguard-home
    server: https://kubernetes.default.svc
  project: default
  source:
    path: manifests/scots-lab/apps/adguard-home
    repoURL: https://github.com/ghubprime/homelab-apps.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      allowEmpty: false
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
    - RespectIgnoreDifferences=true
---
