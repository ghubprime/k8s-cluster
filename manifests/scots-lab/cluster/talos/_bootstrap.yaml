apiVersion: v1
kind: Namespace
metadata:
  labels:
    name: talos-system
  name: talos-system
---
apiVersion: v1
data:
  clusterConfigHash: 91db845cca03637bdb9f0cf3f7f9b8d9a6134726
kind: ConfigMap
metadata:
  name: cluster-config-hash
  namespace: talos-system
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
  name: omnictl-cluster-sync-job
  namespace: talos-system
spec:
  backoffLimit: 1
  completions: 1
  template:
    spec:
      containers:
      - args:
        - cd repo/ && omnictl cluster template validate -f k8s-cluster.yaml && omnictl
          cluster template sync -f k8s-cluster.yaml
        command:
        - /bin/sh
        - -c
        env:
        - name: HOME
          value: /omni
        - name: OMNI_ENDPOINT
          valueFrom:
            secretKeyRef:
              key: omniEndpoint
              name: omni-api-key
        - name: OMNI_SERVICE_ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              key: omniServiceAccountKey
              name: omni-api-key
        image: ghcr.io/ghubprime/omnictl:v1.4.6@sha256:fd3bf8b4892ad7ecc8e3c05ea2ef9bd159d53729feab048c151a31c8d22d2dc4
        name: cluster-template-sync
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - mountPath: /omni
          name: omni
        workingDir: /omni
      initContainers:
      - args:
        - git clone -n --depth=1 --filter=tree:0 https://github.com/ghubprime/k8s-cluster.git
          repo && cd repo && git sparse-checkout set --no-cone /k8s-cluster.yaml /bootstrap
          && git checkout
        command:
        - /bin/sh
        - -c
        env:
        - name: HOME
          value: /omni
        image: docker.io/alpine/git:v2.52.0
        name: clone-source-repo
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - mountPath: /omni
          name: omni
        workingDir: /omni
      restartPolicy: Never
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      tolerations:
      - effect: NoSchedule
        key: node.kubernetes.io/unschedulable
        operator: Exists
      volumes:
      - emptyDir:
          sizeLimit: 500Mi
        name: omni
