apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: cloudflare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflare-tunnel
  template:
    metadata:
      labels:
        app: cloudflare-tunnel
    spec:
      # Highest eviction priority — tunnel loss kills all external access
      priorityClassName: homelab-critical
      # Spread replicas across nodes so a single node reboot doesn't sever ingress
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: cloudflare-tunnel
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2025.4.0
        imagePullPolicy: IfNotPresent
        command:
        - cloudflared
        - tunnel
        - --no-autoupdate
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-token-secret
              key: TUNNEL_TOKEN
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      restartPolicy: Always

