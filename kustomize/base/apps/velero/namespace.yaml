apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    # Privileged required: Node Agent DaemonSet needs host filesystem access
    # for filesystem-level PVC backups (defaultVolumesToFsBackup: true)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
