apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/security/crowdsec/
  - allowlist-rbac.yaml
  - allowlist-job.yaml
  # LAPI shared secret + bouncer registration token, moved out of the chart so
  # they stop being re-keyed on every render. Paired with secrets.externalSecret
  # in values.yaml, which suppresses the chart's own crowdsec-lapi-secrets.
  - sealed-crowdsec-lapi.yaml
helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.0
    releaseName: crowdsec
    namespace: crowdsec
    includeCRDs: true
    valuesFile: ../../../../../helm/overlays/scots-lab/security/crowdsec/values.yaml
