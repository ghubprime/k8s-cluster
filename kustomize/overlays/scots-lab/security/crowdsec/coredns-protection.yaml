apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: crowdsec-coredns-safety-valve
  annotations:
    description: >-
      CRITICAL SAFETY VALVE: Guarantees CoreDNS always accepts inbound DNS traffic
      regardless of CrowdSec bouncer state. Uses CiliumClusterwideNetworkPolicy
      (cluster-scoped, no namespace) to ensure the ALLOW takes effect at the same
      eBPF precedence level as the bouncer's DENY policies.
      See Knowledge/crowdsec-deployment.md Incident 2 for the full post-mortem.
spec:
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
      io.kubernetes.pod.namespace: kube-system
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
