# Early warning for EPHEMERAL partition exhaustion on the ODROID H4 nodes.
#
# Why the upstream node-exporter rules are not enough here:
#
#   kubelet soft eviction (k8s-cluster.yaml)  nodefs.available < 10%   grace 1m30s
#   NodeFilesystemSpaceFillingUp  (warning)   avail < 15%              for: 1h
#   NodeFilesystemAlmostOutOfSpace (warning)  avail < 5%               for: 30m
#
# Those defaults assume large, slowly-filling disks. These nodes boot from a
# 31 GB eMMC whose EPHEMERAL partition is ~29 GB, and a rolling deploy can pull
# enough image layers to cross 21% -> 5% available in minutes. Eviction fires
# after 90 seconds; the first upstream alert needs a full hour below 15%. So in
# practice the cluster evicts pods with no warning at all — observed 2026-08-06,
# when two of three nodes tainted DiskPressure mid-deploy and evicted paperless.
#
# These rules trade specificity for lead time: warn well above the eviction
# threshold, with a short `for:`, so there is time to act before kubelet starts
# killing pods. Scoped to the EPHEMERAL mount so they do not duplicate upstream
# coverage of other filesystems.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scots-lab-ephemeral-storage
  namespace: kube-prometheus-system
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: scots-lab.ephemeral-storage
      rules:
        # Thresholds are set against the observed 2026-08-06 baseline of ~19.5-21%
        # available, NOT round numbers. A 25% warning would fire permanently at
        # today's steady state and train everyone to ignore it.
        - alert: EphemeralStorageLowHeadroom
          expr: |
            node_filesystem_avail_bytes{job="node-exporter",mountpoint="/var"}
              / node_filesystem_size_bytes{job="node-exporter",mountpoint="/var"} * 100 < 18
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "EPHEMERAL partition headroom low on {{ $labels.instance }}"
            description: >-
              {{ $labels.instance }} has {{ printf "%.1f" $value }}% free on /var.
              kubelet begins soft-evicting pods at 10%. Check image footprint with
              `talosctl -n <ip> usage -d 1 /var/lib` — containerd is normally the
              dominant consumer and image GC cannot reclaim in-use layers.

        - alert: EphemeralStorageNearEviction
          expr: |
            node_filesystem_avail_bytes{job="node-exporter",mountpoint="/var"}
              / node_filesystem_size_bytes{job="node-exporter",mountpoint="/var"} * 100 < 12
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} approaching kubelet eviction threshold"
            description: >-
              {{ $labels.instance }} has {{ printf "%.1f" $value }}% free on /var,
              closing on the 10% soft-eviction threshold (90s grace). Pod evictions
              are imminent. Free space or drain non-critical workloads now.

        - alert: NodeUnderDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.node }} is under DiskPressure"
            description: >-
              {{ $labels.node }} reports DiskPressure and carries a NoSchedule taint.
              Pods are being evicted and cannot be scheduled here. This fires on the
              condition itself, so it is not subject to the filesystem-percentage
              thresholds above.
