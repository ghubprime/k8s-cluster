# kube-prometheus-stack values for Talos and dynamic discovery
defaultRules:
  create: true
  rules:
    kubeScheduler: false
    kubeProxy: false
    kubeControllerManager: false
    etcd: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    # Discover all PodMonitors and ServiceMonitors without needing matching labels
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: 20GB
    scrapeConfigSelectorNilUsesHelmValues: false
    # Required for Talos/kubelet certs if they are self-signed or have host mismatches
    # But usually not strictly needed with metrics-server if correctly provisioned.
    # Leaving standard.
    # Persistent storage — moves TSDB off ephemeral eMMC to Ceph
    # Prevents DiskPressure evictions on 27GB root partitions
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 25Gi
    resources:
      requests:
        cpu: 300m
        memory: 1200Mi
        # Ephemeral storage for WAL, compaction temp files, config subpath mounts.
        # TSDB data lives on the 25Gi Ceph PVC — this only covers kubelet-local overhead.
        # Without this limit, volume-subpath bloat consumed 13.1GB during the 2026-06-10
        # power incident, triggering DiskPressure on the 29GB eMMC EPHEMERAL partition.
        ephemeral-storage: 2Gi
      limits:
        cpu: 500m
        memory: 2Gi
        ephemeral-storage: 4Gi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    # Persistent storage for alert state across restarts
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  namespaceOverride: kube-prometheus-system

grafana:
  enabled: true
  # OIDC via Keycloak (Rule #21) — client secret injected from SealedSecret
  envFromSecret: "grafana-oidc-secret"
  namespaceOverride: kube-prometheus-system
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  grafana.ini:
    server:
      root_url: https://grafana.srbii.com
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      client_id: grafana
      scopes: openid profile email
      auth_url: https://auth.srbii.com/realms/homelab/protocol/openid-connect/auth
      token_url: https://auth.srbii.com/realms/homelab/protocol/openid-connect/token
      api_url: https://auth.srbii.com/realms/homelab/protocol/openid-connect/userinfo
      role_attribute_path: "contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'"
      allow_sign_up: true
  service:
    annotations:
      omni-kube-service-exposer.sidero.dev/port: "50086"
      omni-kube-service-exposer.sidero.dev/label: "Grafana"
      omni-kube-service-exposer.sidero.dev/prefix: "grafana"
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.loki.svc.cluster.local:3100
      access: proxy
      isDefault: false

kube-state-metrics:
  enabled: true
  namespaceOverride: kube-prometheus-system
  metricLabelsAllowlist:
    - pods=[*]
    - nodes=[*]
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus-node-exporter:
  namespaceOverride: kube-prometheus-system
  # Reduce node-exporter scrape from 30s to 60s — node metrics change slowly
  # and this halves the series ingestion rate from the highest-cardinality monitor
  prometheus:
    monitor:
      interval: 60s
  hostRootFsMount:
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

namespaceOverride: kube-prometheus-system

