apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-prometheus-system
resources:
  - ../../../../base/monitoring/kube-prometheus-stack/
  - sealed-grafana-oidc-secret.yaml
  - httproute.yaml
  # Early-warning rules for the 29 GB EPHEMERAL partition. The upstream
  # node-exporter alerts fire below the kubelet eviction threshold, so on these
  # nodes pods are evicted before any alert triggers.
  - ephemeral-storage-rules.yaml
helmCharts:
- name: kube-prometheus-stack
  repo: https://prometheus-community.github.io/helm-charts
  version: 86.1.1
  releaseName: kube-prometheus-stack
  namespace: kube-prometheus-system
  includeCRDs: true
  valuesFile: ../../../../../helm/overlays/scots-lab/monitoring/kube-prometheus-stack/values-scots-lab.yaml
patches:
  - patch: |
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true
    target:
      kind: CustomResourceDefinition