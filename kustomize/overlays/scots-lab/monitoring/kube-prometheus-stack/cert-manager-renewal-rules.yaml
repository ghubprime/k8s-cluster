# Catch a broken cert-manager renewal loop months before anything expires.
#
# Why CertificateExpiringSoon is not enough:
#
#   CertificateExpiringSoon   expiration_timestamp - time() < 14d
#
# That fires 14 days before an outage, by which point the fix is urgent and the
# grace window is nearly gone. It also says nothing about *why* — a certificate
# 13 days out is indistinguishable from one that simply has not been renewed.
#
# Applied to the 2026 incident: cert-manager held no leader-election lease from
# 2026-05-27 and renewed nothing for 72 days. renewalTime passed on 2026-07-19
# and notBefore never moved. CertificateExpiringSoon would first have fired on
# 2026-08-04 (14 days before the 2026-08-18 expiry) — and in fact fired never,
# because cert-manager had no ServiceMonitor and the metric had zero series.
# The outage was found by a manual audit on 2026-08-07, 11 days before both the
# internal CA and the *.scots-lab.local wildcard would have expired together.
#
# CertificateRenewalStalled below would have fired 2026-07-19 01:00 — roughly
# three months earlier, while the fix was still routine.
#
# See Knowledge/cert-manager-leader-election-failure.md and RULES.md Rule #30.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scots-lab-cert-manager-renewal
  namespace: kube-prometheus-system
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: scots-lab.cert-manager-renewal
      rules:
        # renewalTime in the past means cert-manager was due to renew and has not.
        # A healthy renewal moves notBefore forward and pushes renewalTime to the
        # next cycle within seconds, so this is only briefly true in normal
        # operation. `for: 1h` is far beyond any legitimate renewal, and still
        # ~3 months earlier than the expiry alert.
        - alert: CertificateRenewalStalled
          expr: certmanager_certificate_renewal_timestamp_seconds < time()
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "cert-manager has not renewed {{ $labels.namespace }}/{{ $labels.name }}"
            description: >-
              Certificate {{ $labels.namespace }}/{{ $labels.name }} passed its
              renewalTime over an hour ago and has not been reissued. The
              certificate is still valid, so `Ready` will read True and ArgoCD will
              read Healthy — neither is evidence renewal works (Rule #30).
              Most likely the controller is not reconciling at all. Check it holds
              its lease: `kubectl get lease cert-manager-controller -n cert-manager
              -o jsonpath='{.spec.holderIdentity}'` must name a RUNNING pod, then
              `kubectl logs -n cert-manager deploy/cert-manager | grep -i forbidden`.
              Confirm recovery by watching notBefore advance, not by Ready.

        # Escalation. At this point it is unambiguously broken rather than a slow
        # or retrying issuance, and it has survived a full working day unnoticed.
        - alert: CertificateRenewalStalledCritical
          expr: certmanager_certificate_renewal_timestamp_seconds < time()
          for: 24h
          labels:
            severity: critical
          annotations:
            summary: "cert-manager renewal broken >24h for {{ $labels.namespace }}/{{ $labels.name }}"
            description: >-
              {{ $labels.namespace }}/{{ $labels.name }} has been overdue for renewal
              for more than 24 hours. Certificates here are 90-day with renewal at the
              60-day mark, leaving only ~30 days of slack before expiry. This
              previously ran undetected for 72 days and came within 11 days of
              expiring the internal CA and the *.scots-lab.local wildcard
              simultaneously, which would have broken every internal HTTPS endpoint
              at once. Treat as an outage in progress.
              See Knowledge/cert-manager-leader-election-failure.md.

        # The alerts above are only as good as the metric behind them. When
        # cert-manager is not scraped the series vanish, every certificate alert
        # silently evaluates to nothing, and "no data" reads exactly like "healthy".
        # That is precisely how the 2026 outage stayed invisible: the
        # CertificateExpiringSoon rule was well-formed but had no ServiceMonitor
        # feeding it, so it could never fire at any threshold.
        #
        # This alert makes the monitoring itself fail closed.
        - alert: CertificateMonitoringBlind
          expr: absent(certmanager_certificate_renewal_timestamp_seconds)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "cert-manager metrics are absent — certificate alerting is blind"
            description: >-
              No certmanager_certificate_* series have been present for 30 minutes,
              so CertificateExpiringSoon, CertificateRenewalStalled and
              CertificateRenewalStalledCritical cannot fire regardless of the real
              state of the certificates. Either cert-manager is down or it is no
              longer being scraped. Check the ServiceMonitor still exists and is
              adopted: `kubectl get servicemonitor cert-manager -n cert-manager`,
              then confirm the targets are up in Prometheus. Until this clears,
              certificate expiry is unmonitored — verify by hand with
              `kubectl get certificates -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,NOTBEFORE:.status.notBefore,NOTAFTER:.status.notAfter,RENEWAL:.status.renewalTime`.
