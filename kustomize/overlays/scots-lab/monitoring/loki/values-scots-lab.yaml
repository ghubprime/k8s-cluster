# Loki Helm values for scots-lab (Monolithic mode)
# Migrated from chart 6.55.0 → 13.1.2 (grafana-community/helm-charts)
# Appropriate for a 3-node homelab cluster with filesystem storage on Ceph

# Deployment mode — "Monolithic" replaces the deprecated "SingleBinary" name
deploymentMode: Monolithic

loki:
  # Authentication disabled for internal cluster use
  auth_enabled: false

  commonConfig:
    replication_factor: 1
    # Path prefix for data storage inside the container
    path_prefix: /var/loki

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 1080h  # 45 days
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    max_query_series: 5000

  # Compactor handles retention enforcement
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

# Monolithic deployment (uses singleBinary key for pod config)
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ceph-block
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Disable the NGINX gateway — unnecessary for monolithic homelab
gateway:
  enabled: false

# Disable memcached sub-charts — not needed at homelab scale
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Disable other deployment modes
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# ServiceMonitor for Prometheus scraping (top-level in 13.x)
serviceMonitor:
  enabled: true

# Loki Canary not needed for homelab
lokiCanary:
  enabled: false

# Monitoring dashboards/rules (restructured in 12.x+)
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false

# Test pods not needed
test:
  enabled: false
