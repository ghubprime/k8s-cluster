global:
  env: scots-lab
  helmDefault: false
  valuesFile: values.yaml
  spec:
    project: default
    destination:
      server: https://kubernetes.default.svc
      namespace: default
    source:
      repoURL: https://github.com/ghubprime/k8s-cluster.git
      targetRevision: HEAD
    # Enforce ServerSideApply cluster-wide to eliminate managedFields etcd bloat
    syncPolicy:
      syncOptions:
        - ServerSideApply=true

argocdApplications:
  argocd:
    disableAutomated: false
    disable: false
    name: argocd
    namespace: argocd
    appCategory: apps
    syncWave: "1"
    description: GitOps continuous delivery engine
  talos:
    disableAutomated: false
    disable: false
    name: talos
    namespace: talos-system
    appCategory: cluster
    syncWave: "1"
    description: Talos Linux OS configuration and machine patches
  omni:
    repoURL: https://github.com/ghubprime/omni-infra.git
    path: "."
    disableAutomated: false
    disable: false
    name: omni
    namespace: omni-system
    directory:
      recurse: true
      include: "{manifests/*}"
    appCategory: cluster
    syncWave: "1"
    description: Sidero Omni cluster management platform
  hostNetwork:
    disableAutomated: false
    disable: true
    name: host-network
    namespace: kube-system
    appCategory: infra
    syncWave: "0"
  multus:
    disableAutomated: false
    disable: false
