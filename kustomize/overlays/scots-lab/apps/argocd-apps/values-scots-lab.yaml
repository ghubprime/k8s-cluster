    syncWave: "1"
    description: Rook operator for Ceph distributed storage
  rook-ceph-cluster:
    disableAutomated: false
    disable: false
    name: rook-ceph-cluster
    namespace: rook-ceph
    appCategory: cluster
    syncWave: "2"
    description: Ceph cluster topology — OSDs, MONs, MDS, RGW
    ignoreDifferences:
      - group: ceph.rook.io
        kind: CephCluster
        jsonPointers:
          - /spec/storage/metadataDevice
  argocdApps:
    disableAutomated: false
    disable: false
    name: argocd-apps
    namespace: argocd
    appCategory: apps
    # Explicitly enforce automated sync policy on the root application 
    # to guarantee orphaned resource garbage collection
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
    ignoreDifferences:
      - group: argoproj.io
        kind: Application
        jsonPointers:
          - /spec/syncPolicy
  certManager:
    disableAutomated: false
    disable: false
    name: cert-manager
    namespace: cert-manager
    appCategory: apps
    syncWave: "1"
    description: Automated TLS certificate management via Let's Encrypt
