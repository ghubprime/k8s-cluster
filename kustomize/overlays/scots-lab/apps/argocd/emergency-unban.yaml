# Purpose-built ClusterRole — scoped to only CiliumClusterwideNetworkPolicy
# Replaces cluster-admin binding (2026-06-06 security hardening)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: emergency-unban-ccwnp
rules:
- apiGroups: ["cilium.io"]
  resources: ["ciliumclusterwidenetworkpolicies"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: emergency-unban
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: emergency-unban-ccwnp
subjects:
- kind: ServiceAccount
  name: emergency-unban
  namespace: argocd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emergency-unban
  namespace: argocd
---
apiVersion: batch/v1
kind: Job
metadata:
  name: emergency-unban-7
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: emergency-unban
      containers:
      - name: kubectl
        # Official K8s image — bitnami/kubectl deprecated Sept 2025
        image: registry.k8s.io/kubectl:v1.36.1
        command:
        - /bin/sh
        - -c
        - |
          echo "Mopping up the final orphaned ghost policy left by dying pods..."
          kubectl delete ccwnp --all
          
          echo "Emergency kernel unban complete!"
      restartPolicy: OnFailure
