dex:
  enabled: false
# Elevate all ArgoCD components above application workloads to protect the
# GitOps control plane from node eviction (repo-server was evicted 2026-06-05)
global:
  priorityClassName: homelab-critical
notifications:
  enabled: false
applicationSet:
  enabled: false
server:
  extraArgs:
    - --insecure
configs:
  cm:
    url: https://argocd.srbii.com
    timeout.reconciliation: "15m"
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_HTTPRoute: |
      jqPathExpressions:
        - '.spec.parentRefs[]?.group'
        - '.spec.parentRefs[]?.kind'
        - '.spec.rules[]?.backendRefs[]?.weight'
        - '.spec.rules[]?.backendRefs[]?.group'
        - '.spec.rules[]?.backendRefs[]?.kind'
        - '.spec.rules[]?.matches'
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_Gateway: |
      jqPathExpressions:
        - '.spec.listeners[]?.tls?.certificateRefs[]?.group'
        - '.spec.listeners[]?.tls?.certificateRefs[]?.kind'
    resource.customizations.ignoreDifferences.apps_StatefulSet: |
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[]?.status'
        - '.spec.volumeClaimTemplates[]?.spec.volumeMode'
        - '.spec.volumeClaimTemplates[]?.spec.accessModes'
        - '.spec.volumeClaimTemplates[]?.spec.resources'
    oidc.config: |
      name: Keycloak
      issuer: https://auth.srbii.com/realms/homelab
      clientID: argocd-client
      clientSecret: $argocd-oidc-secret:oidc.keycloak.clientSecret
      requestedScopes: ["openid", "profile", "email", "groups"]
  rbac:
    policy.default: role:readonly
    scopes: '[groups, email]'
    policy.csv: |
      g, Homelab_Admins, role:admin
      g, /Homelab_Admins, role:admin
      g, homelab-admins, role:admin
      g, /homelab-admins, role:admin
      g, admin, role:admin
      g, /admin, role:admin
controller:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1024Mi"
repoServer:
  # Horizontally scale manifest generation to handle concurrent webhook triggers
  replicas: 2
  resources:
    requests:
      # Baseline required for Kustomize template inflation
      cpu: "100m"
      memory: "256Mi"
    limits:
      # Establish a hard ceiling to prevent node starvation during heavy GitOps syncs
      cpu: "500m"
      memory: "1Gi"