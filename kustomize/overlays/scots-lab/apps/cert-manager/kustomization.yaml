apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - ../../../../base/apps/cert-manager/
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: 1.20.2
    releaseName: cert-manager
    namespace: cert-manager
    includeCRDs: true
    # RULES.md Rule #29 — MUST match the `namespace:` above.
    #
    # The chart puts the leaderelection Role/RoleBinding in
    # global.leaderElection.namespace (default "kube-system") AND passes the same value as
    # --leader-election-namespace on the controller. The blanket `namespace: cert-manager`
    # above rewrites the Role/RoleBinding into cert-manager, but NOT the arg (it is an opaque
    # string in an args array). Leaving the default therefore points the controller at
    # kube-system, where it has no lease permission: it never acquires leadership and does
    # ZERO reconciliation, while still reporting Running / Synced / Healthy / Ready=True.
    #
    # That mismatch renewed no certificates for 72 days (2026-05-27 -> 2026-08-07).
    # See Knowledge/cert-manager-leader-election-failure.md
    valuesInline:
      global:
        leaderElection:
          namespace: cert-manager

      # Scrape cert-manager so certificate-expiry alerting actually works.
      #
      # `CertificateExpiringSoon` has always existed as a Prometheus rule
      #   certmanager_certificate_expiration_timestamp_seconds - time() < 1209600
      # but the metric had ZERO series because nothing scraped cert-manager. The rule could
      # never fire, and did not, while both cluster certs sat 11 days from expiry during a
      # 72-day renewal outage (2026-05-27 -> 2026-08-07). Rule #30.
      #
      # Using the chart's own ServiceMonitor rather than a hand-written one: its selector
      # covers all three components (controller, cainjector, webhook) and it tracks the
      # correct targetPort across chart upgrades.
      #
      # Prometheus here runs serviceMonitorSelector: {} / serviceMonitorNamespaceSelector: {},
      # so no `release: kube-prometheus-stack` label is required for adoption.
      prometheus:
        enabled: true
        servicemonitor:
          enabled: true
