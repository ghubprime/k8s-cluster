crds:
  enabled: true
extraArgs:
  - --enable-gateway-api
# Ensure cert-manager survives eviction during disk pressure events
global:
  priorityClassName: homelab-critical
#startupapicheck:
#  enabled: false
# Right-size cert-manager components for homelab (3-node, ~50 certificates)
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
cainjector:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
webhook:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi