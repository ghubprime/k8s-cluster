apiVersion: apps/v1
kind: Deployment
metadata:
  name: onetimesecret
  namespace: onetimesecret
  labels:
    app: onetimesecret
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onetimesecret
  template:
    metadata:
      labels:
        app: onetimesecret
    spec:
      containers:
      - name: onetimesecret
        image: onetimesecret/onetimesecret:v0.24.7
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: REDIS_URL
          value: redis://127.0.0.1:6379/0
        - name: HOST
          value: expires.srbii.com
        - name: SSL
          value: 'true'
        - name: RACK_ENV
          value: production
        - name: AUTH_REQUIRED
          value: 'false'
        envFrom:
        - secretRef:
            name: onetimesecret-secret
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      - name: redis
        image: redis:7-bookworm
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --appendonly
        - 'yes'
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          runAsUser: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      initContainers:
      - name: fix-redis-permissions
        image: redis:7-bookworm
        command: ['sh', '-c', 'chown -R 999:999 /data']
        volumeMounts:
        - name: redis-data
          mountPath: /data
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: onetimesecret-redis-data
      securityContext:
        seccompProfile:
          type: RuntimeDefault

