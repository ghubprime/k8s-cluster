apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/apps/rook-ceph/
  - ceph-dashboard-autofix-cronjob.yaml
helmCharts:
  - name: rook-ceph
    repo: https://charts.rook.io/release
    version: v1.20.3
    releaseName: rook-ceph
    namespace: rook-ceph
    includeCRDs: true
    valuesFile: ../../../../../helm/overlays/scots-lab/apps/rook-ceph/values-scots-lab.yaml
patches:
- target:
    kind: CustomResourceDefinition
  patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-options
      value: ServerSideApply=true
