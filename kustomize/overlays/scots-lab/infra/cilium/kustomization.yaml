apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/infra/cilium/
  - pool.yaml
  - cilium-pdb.yaml
helmCharts:
  - name: cilium
    repo: https://helm.cilium.io/
    version: 1.19.1
    releaseName: cilium
    namespace: kube-system
    includeCRDs: true
    valuesFile: values.yaml
patches:
  - target:
      version: v1
      kind: Service
      name: hubble-ui
    path: hubble-ui-patch.yaml