apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-health-check
  namespace: kube-system
spec:
  schedule: "0 8 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: daily-health-check
        spec:
          serviceAccountName: health-checker
          containers:
          - name: check
            # Pinned 2026-08-09. Was `bitnami/kubectl:latest` — two problems in one string:
            # (1) :latest is unpinnable and unreviewable; the CrowdSec bouncer is already dead
            #     because its :latest image was deleted from Docker Hub.
            # (2) Bitnami changed how it distributes images on Docker Hub, so that path is an
            #     active supply-chain risk rather than a theoretical one.
            # registry.k8s.io/kubectl is the upstream-maintained image and is already used by
            # the Velero chart values in this repo. Version tracks the cluster (K8s v1.36.1).
            image: registry.k8s.io/kubectl:v1.36.1
            imagePullPolicy: IfNotPresent # Prevent Docker Hub rate-limiting and ImagePullBackOff during scheduled executions
            command: ["/bin/sh", "-c"]
            args:
            - |
              UNHEALTHY=$(kubectl get pods -A --field-selector 'status.phase!=Running,status.phase!=Succeeded' --no-headers 2>/dev/null | wc -l)
              NODES=$(kubectl get nodes --no-headers | grep -v " Ready" | wc -l)
              if [ "$UNHEALTHY" -gt 0 ] || [ "$NODES" -gt 0 ]; then
                curl -d "⚠️ Cluster Health: $UNHEALTHY unhealthy pods, $NODES problem nodes" http://ntfy.ntfy.svc.cluster.local/alerts
              else
                curl -d "✅ Cluster Healthy: All pods running, all nodes ready" http://ntfy.ntfy.svc.cluster.local/alerts
              fi
          restartPolicy: Never
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-checker
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: health-checker-role
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-checker-binding
subjects:
- kind: ServiceAccount
  name: health-checker
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: health-checker-role
  apiGroup: rbac.authorization.k8s.io
