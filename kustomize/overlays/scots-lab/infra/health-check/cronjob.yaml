apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-health-check
  namespace: kube-system
spec:
  schedule: "0 8 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: daily-health-check
        spec:
          serviceAccountName: health-checker
          containers:
          - name: check
            # Image must provide a SHELL, curl and coreutils - this job is a shell script.
            #
            # History worth keeping (2026-08-09/10):
            #   bitnami/kubectl:latest              -> floating tag, the exact pattern that killed
            #                                          the CrowdSec bouncer when its image vanished
            #   registry.k8s.io/kubectl:v1.36.1     -> DISTROLESS. No /bin/sh, no curl, no wc.
            #                                          Broke this job: 7 StartError runs on 08-10
            #                                          ("stat /bin/sh: no such file or directory")
            #   bitnami/kubectl:1.32.0-debian-12-r0 -> ImagePullBackOff. Bitnami removed pinned
            #                                          tags from Docker Hub - the supply-chain
            #                                          risk is real, not theoretical
            #   alpine/k8s:1.36.1                   -> verified in-cluster: SHELL_OK CURL_OK
            #                                          KUBECTL_OK WC_OK, and matches K8s v1.36.1
            image: docker.io/alpine/k8s:1.36.1
            imagePullPolicy: IfNotPresent # Prevent Docker Hub rate-limiting and ImagePullBackOff during scheduled executions
            command: ["/bin/sh", "-c"]
            args:
            - |
              UNHEALTHY=$(kubectl get pods -A --field-selector 'status.phase!=Running,status.phase!=Succeeded' --no-headers 2>/dev/null | wc -l)
              NODES=$(kubectl get nodes --no-headers | grep -v " Ready" | wc -l)
              if [ "$UNHEALTHY" -gt 0 ] || [ "$NODES" -gt 0 ]; then
                curl -d "⚠️ Cluster Health: $UNHEALTHY unhealthy pods, $NODES problem nodes" http://ntfy.ntfy.svc.cluster.local/alerts
              else
                curl -d "✅ Cluster Healthy: All pods running, all nodes ready" http://ntfy.ntfy.svc.cluster.local/alerts
              fi
          restartPolicy: Never
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-checker
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: health-checker-role
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-checker-binding
subjects:
- kind: ServiceAccount
  name: health-checker
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: health-checker-role
  apiGroup: rbac.authorization.k8s.io
