initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.10.0
    volumeMounts:
      - mountPath: /target
        name: plugins
  - name: velero-plugin-for-csi
    image: velero/velero-plugin-for-csi:v0.7.1
    volumeMounts:
      - mountPath: /target
        name: plugins
configuration:
  features: EnableCSI
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: homelab-velero-backups
      config:
        region: auto
        s3ForcePathStyle: "true"
        s3Url: https://aab050132afef4697a7615977f90aa61.r2.cloudflarestorage.com
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: auto
credentials:
  useSecret: true
  existingSecret: velero-cloudflare-credentials

kubectl:
  image:
    repository: docker.io/bitnami/kubectl
    tag: 1.30.1

upgradeCRDs: false

# Homelab resource override — OOMKill threshold must exceed CRD discovery peak
# The cluster has 42+ ArgoCD apps with heavy CRDs (Cilium, Rook, Gateway API)
# which causes Velero to spike above 1Gi during the item_collector enumeration phase
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 2Gi

schedules:
  # Tier 1: Lightweight — K8s resources + CSI snapshots only (no filesystem copy)
  # Runs every 6 hours — fast, low-cost, captures all K8s object state + point-in-time PVC snapshots
  cluster-backup:
    disabled: false
    schedule: "0 */6 * * *"
    template:
      ttl: "720h"
      includedNamespaces:
        - '*'
      snapshotVolumes: true
  # Tier 2: Heavy — Full filesystem-level volume backup (byte-for-byte PVC copy)
  # Runs weekly — the "restore everything" safety net for full data recovery
  weekly-deep-backup:
    disabled: false
    schedule: "0 1 * * 0"
    template:
      ttl: "2160h"
      includedNamespaces:
        - '*'
      defaultVolumesToFsBackup: true
      snapshotVolumes: true
