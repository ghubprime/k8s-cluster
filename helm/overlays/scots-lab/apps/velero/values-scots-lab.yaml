initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.10.0
    volumeMounts:
      - mountPath: /target
        name: plugins
  - name: velero-plugin-for-csi
    image: velero/velero-plugin-for-csi:v0.7.1
    volumeMounts:
      - mountPath: /target
        name: plugins
configuration:
  features: EnableCSI
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: homelab-velero-backups
      config:
        region: auto
        s3ForcePathStyle: "true"
        s3Url: https://aab050132afef4697a7615977f90aa61.r2.cloudflarestorage.com
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: auto
credentials:
  useSecret: true
  existingSecret: velero-cloudflare-credentials

kubectl:
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.36.1

# Ensure Velero survives eviction during disk pressure events
priorityClassName: homelab-critical

upgradeCRDs: false

# Homelab resource override — OOMKill threshold must exceed CRD discovery peak
# The cluster has 42+ ArgoCD apps with heavy CRDs (Cilium, Rook, Gateway API)
# which causes Velero to spike above 1Gi during the item_collector enumeration phase
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 2Gi

# Enable Node Agent DaemonSet for filesystem-level PVC backups (deep-cluster-backup)
# Without this, defaultVolumesToFsBackup: true silently fails with
# "daemonset pod not found in running state in node" for every pod.
# Discovered 2026-05-25 during audit — was never enabled (chart default: false).
deployNodeAgent: true

nodeAgent:
  podVolumePath: /var/lib/kubelet/pods
  privileged: true
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

schedules:
  # Tier 1: Lightweight — K8s resources + CSI snapshots only (no filesystem copy)
  # Runs every 6 hours — fast, low-cost, captures all K8s object state + point-in-time PVC snapshots
  cluster-backup:
    disabled: false
    schedule: "0 0,6,12,18 * * *"  # Explicit hours to avoid 01-05 UTC (6-10 PM PDT)
    template:
      ttl: "720h"
      includedNamespaces:
        - '*'
      snapshotVolumes: true
  # Tier 2: Heavy — Full filesystem-level volume backup (byte-for-byte PVC copy)
  # Runs every 48 hours — the "restore everything" safety net for full data recovery
  deep-cluster-backup:
    disabled: false
    schedule: "0 6 */2 * *"  # Shifted from 1 AM UTC (6 PM PDT) to 6 AM UTC (11 PM PDT)
    template:
      ttl: "2160h"
      includedNamespaces:
        - '*'
      defaultVolumesToFsBackup: true
      snapshotVolumes: true
