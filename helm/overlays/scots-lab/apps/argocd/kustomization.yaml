apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../base/apps/argocd
helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 9.0.5
    releaseName: argo-cd
    namespace: argocd
    includeCRDs: true
    valuesFile: values-scots-lab.yaml