# Rook Ceph Operator values for monitoring
monitoring:
  enabled: true

resources:
  requests:
    # Increased from 10m to 250m to align with actual observed operator consumption (201m).
    # This ensures the scheduler accurately reserves node capacity, preventing 
    # the Ceph control loop from being CPU-starved during critical cluster reconciliation.
    cpu: 250m
    memory: 128Mi
  limits:
    # Establish a safe QoS ceiling to prevent runaway operator loops from 
    # saturating node CPU resources.
    cpu: 500m
    memory: 256Mi

# Homelab CSI resource overrides — defaults allocate 300m per CSI node plugin
# (250m driver + 50m registrar) × 6 plugins (3 nodes × 2 drivers) = 1800m total.
# Reduced to free up CPU headroom across all nodes.
csi:
  csiRBDPluginResource: |
    - name : driver-registrar
      resource:
        requests:
          memory: 64Mi
          cpu: 15m
        limits:
          memory: 256Mi
    - name : csi-rbdplugin
      resource:
        requests:
          memory: 256Mi
          cpu: 50m
        limits:
          memory: 1Gi
    - name : liveness-prometheus
      resource:
        requests:
          memory: 64Mi
          cpu: 15m
        limits:
          memory: 256Mi
  csiCephFSPluginResource: |
    - name : driver-registrar
      resource:
        requests:
          memory: 64Mi
          cpu: 15m
        limits:
          memory: 256Mi
    - name : csi-cephfsplugin
