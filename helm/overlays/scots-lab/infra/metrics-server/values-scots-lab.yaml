# Metrics Server values for scots-lab (Talos Linux v1.13.3 bare-metal)
# Provides the Kubernetes Metrics API for kubectl top and HPA autoscaling

args:
  # Talos uses self-signed kubelet serving certificates
  - --kubelet-insecure-tls
  # Cilium replaces kube-proxy — prefer direct node IP communication
  - --kubelet-preferred-address-types=InternalIP

# Bypass Cilium network overlay to reach Talos node IPs directly
hostNetwork:
  enabled: true

# Avoid port collision with Talos Kubelet (10250) on host network
containerPort: 10251

# Resource limits for homelab (3-node cluster)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Single replica sufficient for homelab
replicas: 1

# APIService registration
apiService:
  insecureSkipTLSVerify: true
