# kube-prometheus-stack values for Talos and dynamic discovery
defaultRules:
  create: true
  rules:
    kubeScheduler: false
    kubeProxy: false
    kubeControllerManager: false
    etcd: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    # Monitoring must survive node pressure events to maintain observability
    priorityClassName: homelab-critical
    resources:
      requests:
        cpu: 200m
        # Actual baseline ~1.1Gi; 1280Mi provides accurate scheduling signal with headroom
        memory: 1280Mi
      limits:
        # CPU limit removed to prevent severe throttling during metric scraping bursts
        # Memory limit retained at 2Gi to prevent uncontrolled node memory saturation
        memory: 2Gi
    # Discover all PodMonitors and ServiceMonitors without needing matching labels
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: 20GB
    # ⚠️ Prometheus stays on ceph-block on purpose — do NOT copy the Alertmanager
    # emptyDir change up here. 20-25Gi of TSDB cannot live on the nodes' 29GB eMMC,
    # which is already firing EphemeralStorageLowHeadroom. Losing metrics history on
    # every restart would also destroy the ability to investigate the incident you are
    # currently in. Alertmanager holds ~1Gi of disposable state; Prometheus does not.
    scrapeConfigSelectorNilUsesHelmValues: false
    # Persistent storage — moves TSDB off ephemeral eMMC to Ceph
    # Prevents DiskPressure evictions on 27GB root partitions
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 25Gi
    # Required for Talos/kubelet certs if they are self-signed or have host mismatches
    # But usually not strictly needed with metrics-server if correctly provisioned.
    # Leaving standard.
  service:
    annotations:
      omni-kube-service-exposer.sidero.dev/port: "50089"
      omni-kube-service-exposer.sidero.dev/label: "Prometheus"
      omni-kube-service-exposer.sidero.dev/prefix: "prometheus"

alertmanager:
  alertmanagerSpec:
    replicas: 1
    priorityClassName: homelab-critical
    # ── NO PVC — deliberately on emptyDir since 2026-08-09 ─────────────────────
    # Audit finding SRE P1: the alerting plane must not depend on the storage plane.
    #
    # This previously used a 1Gi `ceph-block` PVC. That created a circular dependency:
    # if Ceph degrades — and Ceph has been HEALTH_WARN — then any Alertmanager restart
    # or reschedule cannot mount its volume, so Alertmanager stays down. You lose
    # alerting at exactly the moment you need it, and the first symptom is silence,
    # which is indistinguishable from health. That is Rule #30 baked into the topology
    # of the monitoring stack itself.
    #
    # THE TRADE, stated plainly: on restart Alertmanager loses its silences and its
    # notification log (nflog). Practical effect for a single-operator homelab —
    # previously-silenced alerts start firing again, and some notifications may repeat.
    # Both failure modes are LOUD. The PVC's failure mode is SILENT. Loud wins.
    #
    # Note there is no non-Ceph StorageClass in this cluster (only ceph-block and
    # ceph-filesystem), so "move it to local storage" is not available without adding a
    # local-path provisioner — extra moving parts for 1Gi of ephemeral state.
    #
    # To revert: restore the storage: block below.
    #   storage:
    #     volumeClaimTemplate:
    #       spec:
    #         storageClassName: ceph-block
    #         accessModes: ["ReadWriteOnce"]
    #         resources: {requests: {storage: 1Gi}}
    #
    # ⚠️ Prometheus DELIBERATELY stays on ceph-block — see prometheusSpec below. Do not
    # apply this same change there.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: ntfy-warning
      group_by: ["alertname", "namespace", "job"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
      # Critical goes to its OWN ntfy topic. Previously both branches pointed at the
      # same receiver and differed only in repeat_interval, so on the phone a critical
      # alert was indistinguishable from a warning — the routing was decorative.
      - match:
          severity: critical
        receiver: ntfy-critical
        repeat_interval: 1h
      - match:
          severity: warning
        receiver: ntfy-warning
        repeat_interval: 4h
    # Inhibition: when a node is down or Ceph is in ERROR, dozens of dependent alerts
    # fire for the same underlying cause. Without these rules a single node failure
    # produces an unreadable wall of notifications and the real signal is lost in it.
    inhibit_rules:
      # A critical alert suppresses the warning-level version of the same alert.
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: ["alertname", "namespace"]
      # A down node suppresses everything else scoped to that node.
      - source_matchers: ['alertname = "KubeNodeNotReady"']
        target_matchers: ['severity =~ "warning|critical"']
        equal: ["node"]
      # Ceph in ERROR suppresses the individual component warnings underneath it.
      - source_matchers: ['alertname = "CephClusterErrorState"']
        target_matchers: ['severity = "warning"']
        equal: ["namespace"]
    receivers:
    # ntfy maps the topic from the URL path. Set the critical topic to a high priority
    # and a distinct sound in the ntfy client so it is recognisable without reading it.
    - name: ntfy-critical
      webhook_configs:
      - url: http://ntfy.ntfy.svc.cluster.local/alerts-critical
        send_resolved: true
    - name: ntfy-warning
      webhook_configs:
      - url: http://ntfy.ntfy.svc.cluster.local/alerts
        send_resolved: true
  namespaceOverride: kube-prometheus-system

grafana:
  enabled: true
  priorityClassName: homelab-critical
  # OIDC via Keycloak is the primary auth method (Rule #21); this is the local
  # fallback admin.
  #
  # Previously left unset so the chart would auto-generate. That is what caused
  # the churn: with no cluster `lookup` available during offline `kustomize build`,
  # the chart minted a NEW random admin-password on every CI render, so each push
  # to main rewrote the Secret, changed the checksum/secret annotation, and
  # restarted Grafana — leaving the documented admin password invalid.
  #
  # admin.existingSecret suppresses the chart's own Secret entirely (LDAP is
  # disabled, so ldap-toml is not needed from it). The SealedSecret carries the
  # value that was already live, so this is a no-op for the running instance.
  admin:
    existingSecret: grafana-admin-creds
    userKey: admin-user
    passwordKey: admin-password
  envFromSecret: grafana-oidc-secret
  grafana.ini:
    server:
      root_url: https://grafana.srbii.com
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana-client
      scopes: openid email profile
      auth_url: https://auth.srbii.com/realms/homelab/protocol/openid-connect/auth
      token_url: https://auth.srbii.com/realms/homelab/protocol/openid-connect/token
      api_url: https://auth.srbii.com/realms/homelab/protocol/openid-connect/userinfo
      role_attribute_path: contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'
  namespaceOverride: kube-prometheus-system
  service:
    annotations:
      omni-kube-service-exposer.sidero.dev/port: "50086"
      omni-kube-service-exposer.sidero.dev/label: "Grafana"
      omni-kube-service-exposer.sidero.dev/prefix: "grafana"
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.loki.svc.cluster.local:3100
      access: proxy
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: community
          orgId: 1
          folder: Community
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/community
  dashboards:
    community:
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      ceph-cluster:
        gnetId: 2842
        revision: 18
        datasource: Prometheus
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus

kube-state-metrics:
  enabled: true
  namespaceOverride: kube-prometheus-system
  priorityClassName: homelab-critical
  # Expose Velero BackupRepository status as metrics (audit finding SRE P5).
  #
  # Why: every existing Velero alert watches whether the backup JOB ran. None watched
  # whether the data is RESTORABLE. That is the exact gap that let 12 phantom restore
  # points accumulate while reporting Completed — the kopia repositories were destroyed
  # on 2026-08-02 and each BackupRepository sat at `phase: Ready` with a fatal
  # `.status.message` of "repository not initialized in the provided storage" for days,
  # alerting nobody. Rule #30 in its purest form: Ready was not evidence of anything.
  #
  # Both fields are exposed because phase alone would NOT have caught it — the phase was
  # Ready the whole time. The message is the signal.
  #
  # ⚠️ VERIFY AFTER SYNC: a malformed customResourceState config makes kube-state-metrics
  # crash-loop, which would take out a large share of cluster monitoring. Confirm with:
  #   kubectl -n kube-prometheus-system get pods -l app.kubernetes.io/name=kube-state-metrics
  # If it is not Running, set `customResourceState.enabled: false` and push again.
  # The paired VeleroBackupRepositoryMonitoringBlind alert below fires if the metric
  # never appears, so a silent failure of this block is not possible.
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: velero.io
              version: v1
              kind: BackupRepository
            metricNamePrefix: velero_backuprepository
            metrics:
              # Name MUST end in _info for an Info-type metric. kube-state-metrics does
              # NOT append the suffix for you — it logs "Info metric does not have _info
              # suffix" and publishes the family under the bare name. Named `status`
              # first, which produced `velero_backuprepository_status` while the alerts
              # below queried `..._status_info`, so they matched nothing and could never
              # have fired. Verified against the live /metrics endpoint 2026-08-09.
              - name: status_info
                help: "Velero BackupRepository phase and status message"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                      phase: [status, phase]
                      message: [status, message]
  rbac:
    extraRules:
      - apiGroups: ["velero.io"]
        resources: ["backuprepositories"]
        verbs: ["list", "watch"]
  metricLabelsAllowlist:
    # Expose only labels used in dashboards and alerts to control time series cardinality.
    # Wildcard pods=[*] was inflating series count from high-cardinality labels
    # like pod-template-hash and batch.kubernetes.io/job-name.
    - pods=[app.kubernetes.io/name,app.kubernetes.io/instance,app.kubernetes.io/component]
    - nodes=[kubernetes.io/hostname,node.kubernetes.io/instance-type]

prometheus-node-exporter:
  namespaceOverride: kube-prometheus-system
  priorityClassName: homelab-critical
  hostRootFsMount:
    enabled: true

namespaceOverride: kube-prometheus-system

additionalPrometheusRulesMap:
  velero-backup-health:
    groups:
    - name: velero.rules
      rules:
      - alert: VeleroBackupPartiallyFailed
        expr: velero_backup_partial_failure_total{schedule!=""} > velero_backup_partial_failure_total{schedule!=""} offset 1h
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Velero backup partially failed ({{ $labels.schedule }})"
          description: "Schedule {{ $labels.schedule }} reported partial failures in the last hour."
      - alert: VeleroBackupFailed
        expr: velero_backup_failure_total{schedule!=""} > velero_backup_failure_total{schedule!=""} offset 1h
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Velero backup FAILED ({{ $labels.schedule }})"
          description: "Schedule {{ $labels.schedule }} reported failures in the last hour. Investigate immediately — all PVC data is at risk."
      - alert: VeleroBackupMissing
        expr: time() - velero_backup_last_successful_timestamp{schedule!=""} > 28800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Velero backup missing for 8+ hours ({{ $labels.schedule }})"
          description: "No successful backup for schedule {{ $labels.schedule }} in over 8 hours. The backup pipeline may be stalled or OOMKilled."

      # ── Restorability, not just job success (added 2026-08-09) ──────────────────
      # The three alerts above all watch whether the backup JOB ran. These watch whether
      # the data can actually be restored. See the kube-state-metrics block above.
      - alert: VeleroBackupRepositoryNotReady
        expr: velero_backuprepository_status_info{phase!="Ready"} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Velero BackupRepository {{ $labels.name }} is {{ $labels.phase }}"
          description: >-
            BackupRepository {{ $labels.name }} has not been Ready for 15 minutes.
            New PVC data is probably not reaching R2 even if backups report Completed.

      # The one that would actually have caught 2026-08-02. Phase stayed `Ready`; the
      # message was the only evidence. Never trust the phase alone here.
      - alert: VeleroBackupRepositoryUnhealthyMessage
        expr: velero_backuprepository_status_info{message!=""} == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Velero BackupRepository {{ $labels.name }} reports an error"
          description: >-
            BackupRepository {{ $labels.name }} carries status message
            "{{ $labels.message }}" while phase is {{ $labels.phase }}. A Ready phase
            alongside a non-empty message is the exact signature of destroyed kopia
            repositories (Rule #31). Treat every restore point as suspect until a real
            restore proves otherwise — do NOT trust the Completed status of backups.

      # Fail closed, same pattern as CertificateMonitoringBlind: if the custom-resource
      # metric never appears (bad CRS config, missing RBAC, KSM crash-looping) then the
      # two alerts above can never fire, and their silence would look like health.
      - alert: VeleroBackupRepositoryMonitoringBlind
        expr: absent(velero_backuprepository_status_info)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Velero BackupRepository monitoring is not reporting"
          description: >-
            velero_backuprepository_status_info has no series. The restorability alerts
            cannot fire, so backup health is currently unverified. Check
            kube-state-metrics is Running and its customResourceState config parsed.
  ceph-capacity-alerts:
    groups:
    - name: ceph-capacity.rules
      rules:
      - alert: CephPoolNearFull
        expr: (ceph_pool_stored / ceph_pool_max_avail) * 100 > 70
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Ceph pool {{ $labels.name }} is {{ $value | humanize }}% full"
          description: "Pool {{ $labels.name }} has exceeded 70% utilization. Plan capacity expansion."
      - alert: CephPoolCriticallyFull
        expr: (ceph_pool_stored / ceph_pool_max_avail) * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Ceph pool {{ $labels.name }} is {{ $value | humanize }}% full — CRITICAL"
          description: "Pool {{ $labels.name }} has exceeded 85% utilization. Immediate action required to prevent write failures."
  cert-expiry-alerts:
    groups:
    - name: cert-manager.rules
      rules:
      - alert: CertificateExpiringSoon
        expr: certmanager_certificate_expiration_timestamp_seconds - time() < 1209600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.name }} expires in < 14 days"
          description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} expires in {{ $value | humanizeDuration }}."

