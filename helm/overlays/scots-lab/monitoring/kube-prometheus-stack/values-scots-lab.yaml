# kube-prometheus-stack values for Talos and dynamic discovery
defaultRules:
  create: true
  rules:
    kubeScheduler: false
    kubeProxy: false
    kubeControllerManager: false
    etcd: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

prometheus:
  prometheusSpec:
    # Monitoring must survive node pressure events to maintain observability
    priorityClassName: homelab-critical
    resources:
      requests:
        cpu: 200m
        # Actual baseline ~1.1Gi; 1280Mi provides accurate scheduling signal with headroom
        memory: 1280Mi
      limits:
        # CPU limit removed to prevent severe throttling during metric scraping bursts
        # Memory limit retained at 2Gi to prevent uncontrolled node memory saturation
        memory: 2Gi
    # Discover all PodMonitors and ServiceMonitors without needing matching labels
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: 20GB
    scrapeConfigSelectorNilUsesHelmValues: false
    # Persistent storage — moves TSDB off ephemeral eMMC to Ceph
    # Prevents DiskPressure evictions on 27GB root partitions
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 25Gi
    # Required for Talos/kubelet certs if they are self-signed or have host mismatches
    # But usually not strictly needed with metrics-server if correctly provisioned.
    # Leaving standard.
  service:
    annotations:
      omni-kube-service-exposer.sidero.dev/port: "50089"
      omni-kube-service-exposer.sidero.dev/label: "Prometheus"
      omni-kube-service-exposer.sidero.dev/prefix: "prometheus"

alertmanager:
  alertmanagerSpec:
    replicas: 1
    priorityClassName: homelab-critical
    # Persistent storage for alert state across restarts
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: ntfy
      group_by: ["alertname", "namespace", "job"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
      - match:
          severity: critical
        receiver: ntfy
        repeat_interval: 1h
      - match:
          severity: warning
        receiver: ntfy
        repeat_interval: 4h
    receivers:
    - name: ntfy
      webhook_configs:
      - url: http://ntfy.ntfy.svc.cluster.local/alerts
        send_resolved: true
  namespaceOverride: kube-prometheus-system

grafana:
  enabled: true
  priorityClassName: homelab-critical
  # OIDC via Keycloak is the primary auth method (Rule #21); this is the local
  # fallback admin.
  #
  # Previously left unset so the chart would auto-generate. That is what caused
  # the churn: with no cluster `lookup` available during offline `kustomize build`,
  # the chart minted a NEW random admin-password on every CI render, so each push
  # to main rewrote the Secret, changed the checksum/secret annotation, and
  # restarted Grafana — leaving the documented admin password invalid.
  #
  # admin.existingSecret suppresses the chart's own Secret entirely (LDAP is
  # disabled, so ldap-toml is not needed from it). The SealedSecret carries the
  # value that was already live, so this is a no-op for the running instance.
  admin:
    existingSecret: grafana-admin-creds
    userKey: admin-user
    passwordKey: admin-password
  envFromSecret: grafana-oidc-secret
  grafana.ini:
    server:
      root_url: https://grafana.srbii.com
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana-client
      scopes: openid email profile
      auth_url: https://auth.srbii.com/realms/homelab/protocol/openid-connect/auth
      token_url: https://auth.srbii.com/realms/homelab/protocol/openid-connect/token
      api_url: https://auth.srbii.com/realms/homelab/protocol/openid-connect/userinfo
      role_attribute_path: contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'
  namespaceOverride: kube-prometheus-system
  service:
    annotations:
      omni-kube-service-exposer.sidero.dev/port: "50086"
      omni-kube-service-exposer.sidero.dev/label: "Grafana"
      omni-kube-service-exposer.sidero.dev/prefix: "grafana"
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.loki.svc.cluster.local:3100
      access: proxy
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: community
          orgId: 1
          folder: Community
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/community
  dashboards:
    community:
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      ceph-cluster:
        gnetId: 2842
        revision: 18
        datasource: Prometheus
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus

kube-state-metrics:
  enabled: true
  namespaceOverride: kube-prometheus-system
  priorityClassName: homelab-critical
  metricLabelsAllowlist:
    # Expose only labels used in dashboards and alerts to control time series cardinality.
    # Wildcard pods=[*] was inflating series count from high-cardinality labels
    # like pod-template-hash and batch.kubernetes.io/job-name.
    - pods=[app.kubernetes.io/name,app.kubernetes.io/instance,app.kubernetes.io/component]
    - nodes=[kubernetes.io/hostname,node.kubernetes.io/instance-type]

prometheus-node-exporter:
  namespaceOverride: kube-prometheus-system
  priorityClassName: homelab-critical
  hostRootFsMount:
    enabled: true

namespaceOverride: kube-prometheus-system

additionalPrometheusRulesMap:
  velero-backup-health:
    groups:
    - name: velero.rules
      rules:
      - alert: VeleroBackupPartiallyFailed
        expr: velero_backup_partial_failure_total{schedule!=""} > velero_backup_partial_failure_total{schedule!=""} offset 1h
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Velero backup partially failed ({{ $labels.schedule }})"
          description: "Schedule {{ $labels.schedule }} reported partial failures in the last hour."
      - alert: VeleroBackupFailed
        expr: velero_backup_failure_total{schedule!=""} > velero_backup_failure_total{schedule!=""} offset 1h
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Velero backup FAILED ({{ $labels.schedule }})"
          description: "Schedule {{ $labels.schedule }} reported failures in the last hour. Investigate immediately — all PVC data is at risk."
      - alert: VeleroBackupMissing
        expr: time() - velero_backup_last_successful_timestamp{schedule!=""} > 28800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Velero backup missing for 8+ hours ({{ $labels.schedule }})"
          description: "No successful backup for schedule {{ $labels.schedule }} in over 8 hours. The backup pipeline may be stalled or OOMKilled."
  ceph-capacity-alerts:
    groups:
    - name: ceph-capacity.rules
      rules:
      - alert: CephPoolNearFull
        expr: (ceph_pool_stored / ceph_pool_max_avail) * 100 > 70
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Ceph pool {{ $labels.name }} is {{ $value | humanize }}% full"
          description: "Pool {{ $labels.name }} has exceeded 70% utilization. Plan capacity expansion."
      - alert: CephPoolCriticallyFull
        expr: (ceph_pool_stored / ceph_pool_max_avail) * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Ceph pool {{ $labels.name }} is {{ $value | humanize }}% full — CRITICAL"
          description: "Pool {{ $labels.name }} has exceeded 85% utilization. Immediate action required to prevent write failures."
  cert-expiry-alerts:
    groups:
    - name: cert-manager.rules
      rules:
      - alert: CertificateExpiringSoon
        expr: certmanager_certificate_expiration_timestamp_seconds - time() < 1209600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.name }} expires in < 14 days"
          description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} expires in {{ $value | humanizeDuration }}."

