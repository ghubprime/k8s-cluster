# Rook Ceph Cluster values for monitoring
cephImage:
  tag: v20.2.0
  allowUnsupported: true

monitoring:
  enabled: true
  createPrometheusRules: true
  # metricsDisabled is false by default when enabled is true

cephClusterSpec:
  # Re-enabled after nuclear reset stabilization. Only set to true during emergency recovery.
  skipUpgradeChecks: false
  # Enable PodDisruptionBudgets for MON, OSD, RGW, MDS daemons.
  # Ensures coordinated disruptions during node reboots and rolling upgrades.
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
    pgHealthCheckTimeout: 0
  storage:
    useAllNodes: false
    useAllDevices: false
    # Only match data HDDs (sdb, sdc). After eMMC boot migration, sda is the M.2 SATA SSD (unused).
    deviceFilter: ^sd[bc]$
    nodes:
    - name: talos-23m-4vp
      devices:
      - name: sdb
      - name: sdc
    - name: talos-2j9-th8
      devices:
      - name: sdb
      - name: sdc
    - name: talos-pyf-pz9
      devices:
      - name: sdb
      - name: sdc
  network:
    provider: host
    connections:
      encryption:
        enabled: false
    selectors:
      public: "192.168.8.0/24"
      cluster: "10.10.0.0/24"
  dashboard:
    ssl: false
    port: 7001
  annotations:
    dashboard:
      omni-kube-service-exposer.sidero.dev/port: "7001"
      omni-kube-service-exposer.sidero.dev/label: "Ceph Dashboard"
      omni-kube-service-exposer.sidero.dev/prefix: "cephdash"
  # Homelab resource overrides — production defaults allocate 1000m per OSD/MON
  # which saturates all 3 nodes at 99% CPU requests. Actual usage is <100m per daemon.
  resources:
    mon:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    mgr:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    osd:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        # Establish QoS ceiling to prevent OSD rebalancing from saturating node CPU
        cpu: 1000m
        memory: 4Gi
    mgr-sidecar:
      requests:
        cpu: 25m
        memory: 40Mi
      limits:
        memory: 100Mi
    mds:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 4Gi
    crashcollector:
      requests:
        cpu: 15m
        memory: 60Mi
      limits:
        memory: 256Mi
    exporter:
      requests:
        cpu: 15m
        memory: 50Mi
      limits:
        memory: 128Mi

toolbox:
  enabled: true

cephBlockPoolsVolumeSnapshotClass:
  enabled: true
  name: ceph-block
  isDefault: true
  deletionPolicy: Retain

cephFileSystemVolumeSnapshotClass:
  enabled: true
  name: ceph-filesystem
  isDefault: false
  deletionPolicy: Retain
