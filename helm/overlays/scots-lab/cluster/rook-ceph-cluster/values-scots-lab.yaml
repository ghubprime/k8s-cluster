# Rook Ceph Cluster values for monitoring
cephImage:
  tag: v20.2.0
  allowUnsupported: true

monitoring:
  enabled: true
  createPrometheusRules: true
  # metricsDisabled is false by default when enabled is true

cephClusterSpec:
  # Re-enabled after nuclear reset stabilization. Only set to true during emergency recovery.
  skipUpgradeChecks: false
  # Enable PodDisruptionBudgets for MON, OSD, RGW, MDS daemons.
  # Ensures coordinated disruptions during node reboots and rolling upgrades.
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
    pgHealthCheckTimeout: 0
  storage:
    useAllNodes: false
    useAllDevices: false
    # Only match data HDDs (sdb, sdc). M.2 SSD (sda) used for WAL+DB metadata acceleration.
    deviceFilter: ^sd[bc]$
    config:
      metadataDevice: sda
    nodes:
    - name: talos-23m-4vp
      devices:
      - name: sdb
      - name: sdc
    - name: talos-2j9-th8
      devices:
      - name: sdb
      - name: sdc
    - name: talos-pyf-pz9
      devices:
      - name: sdb
      - name: sdc
  network:
    provider: host
    connections:
      encryption:
        enabled: false
    selectors:
      public: "192.168.8.0/24"
      cluster: "10.10.0.0/24"
  dashboard:
    ssl: false
    port: 7001
  annotations:
    dashboard:
      omni-kube-service-exposer.sidero.dev/port: "7001"
      omni-kube-service-exposer.sidero.dev/label: "Ceph Dashboard"
      omni-kube-service-exposer.sidero.dev/prefix: "cephdash"
  # Homelab resource overrides — production defaults allocate 1000m per OSD/MON
  # which saturates all 3 nodes at 99% CPU requests. Actual usage is <100m per daemon.
  resources:
    mon:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    mgr:
      requests:
        cpu: 100m
        # Increased memory request from 256Mi to 600Mi to accurately reflect
        # baseline consumption (~550Mi) and ensure the kube-scheduler 
        # reserves sufficient node capacity to prevent OOM evictions.
        memory: 600Mi
      limits:
        memory: 1Gi
    osd:
      requests:
        # The request is what freed ~14,650m of scheduling capacity in May and took node
        # allocation from 99% to ~55%. Keep it. See Knowledge/ceph-cpu-saturation-bug.md.
        cpu: 100m
        # Actual OSD scheduling footprint is ~512Mi; steady-state usage is 887Mi-989Mi
        memory: 512Mi
      limits:
        # ── NO cpu LIMIT ON OSDs — deliberately absent (2026-08-09) ──────────────
        # Previously `cpu: 400m`, added to stop rebalancing spikes causing evictions.
        # A CPU limit is enforced by CFS quota: once the OSD burns its slice within a
        # scheduling period it is hard-throttled until the next one. That stalls the
        # BlueStore commit path, and the symptom is BLUESTORE_SLOW_OP_ALERT — which was
        # firing on osd.3, osd.5 and osd.7 and was recorded as "not yet root-caused".
        #
        # Ceph upstream advises against CPU limits on OSDs. The `requests` value above is
        # what protects scheduling; the limit only created the problem it was meant to
        # prevent. Rule #30: verify the work product, not the Ready flag.
        #
        # ⚠️ If slow ops persist after this change, the competing hypothesis stands — the
        # three slow OSDs are each the *second* OSD of a pair sharing one M.2 WAL+DB
        # device, i.e. SSD contention. See Knowledge/ceph-waldb-migration-runbook.md.
        #
        # Ceph Tentacle v20.2.0 requires >1GiB during config initialization (parse_env).
        # Previous 1Gi limit caused ceph_assert crash in set_val_default(). Set to 4Gi
        # to match MDS and provide headroom for recovery I/O spikes.
        memory: 4Gi
    mgr-sidecar:
      requests:
        cpu: 25m
        memory: 40Mi
      limits:
        memory: 100Mi
    mds:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 4Gi
    crashcollector:
      requests:
        cpu: 15m
        memory: 60Mi
      limits:
        memory: 256Mi
    exporter:
      requests:
        cpu: 15m
        memory: 50Mi
      limits:
        memory: 128Mi

toolbox:
  enabled: true

# ── deletionPolicy: Retain -> Delete (2026-08-10) ───────────────────────────────
# `Retain` leaked 9,910 orphaned RBD snapshot images (86.7% of all snapshot images
# in ceph-blockpool) and ~1.77 TiB of space.
#
# The mechanism: Velero CSI-snapshots every PVC every 6 hours. The backup expires
# at its TTL and its VolumeSnapshot object is removed — but `Retain` means the
# VolumeSnapshotContent AND the underlying Ceph RBD image are deliberately kept.
# Nothing ever collects them. Measured 2026-08-09:
#
#     csi-vol-*  live PVC volumes :     40   (matches 40 PVCs exactly — no leak here)
#     csi-snap-* snapshot images  : 11,432
#     VolumeSnapshotContent        :  1,856
#     VolumeSnapshot               :     39
#
# `ceph df` reported 1.8 TiB stored against ~32 GiB of live filesystem data.
#
# `Delete` makes the RBD image go away when its VolumeSnapshot does, which is the
# correct lifecycle for snapshots that Velero creates and expires on a schedule.
#
# ⚠️ WHAT THIS CHANGES: deleting a VolumeSnapshot now destroys its underlying data
# immediately, instead of leaving a recoverable image behind. That is the intended
# behaviour here — Velero owns these and expires them on TTL — but it does remove a
# safety net that previously existed by accident. Off-site protection does not rely
# on these: CSI snapshots never leave Ceph (`snapshotMoveData` is unset), so the
# real restore path is the Velero fs-backup to R2 and its Google Drive mirror.
#
# ⚠️ This does NOT retroactively clean the existing 9,910 orphans — those predate
# any VolumeSnapshot object and must be removed with tools/ceph-snapshot-audit.py.
cephBlockPoolsVolumeSnapshotClass:
  enabled: true
  name: ceph-block
  isDefault: true
  deletionPolicy: Delete

cephFileSystemVolumeSnapshotClass:
  enabled: true
  name: ceph-filesystem
  isDefault: false
  deletionPolicy: Delete
